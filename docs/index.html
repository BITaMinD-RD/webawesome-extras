<!doctype html>
<html lang="en" class="wa-theme-default">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Not for training AI: a reservation of text and data mining (EU Directive 2019/790, art. 4(3)) and the noai hint some crawlers read -->
  <meta name="tdm-reservation" content="1">
  <meta name="robots" content="noai, noimageai">
  <title>webawesome-extras</title>

  <!--
    The documentation site of webawesome-extras: static files, no build. Web Awesome, Lit and marked (which renders the Markdown pages) come from a CDN (jsDelivr) through the import map,
    the same versions as demo/index.html, and the elements from ../src, so it works on GitHub Pages and from any static server (serve the ROOT of the repository and open /docs/);
    it needs a connection, not `npm install`.
  -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/styles/webawesome.css">
  <link rel="stylesheet" href="site/site.css">

  <script type="importmap">
    {
      "imports": {
        "lit": "https://cdn.jsdelivr.net/npm/lit@3.3.3/+esm",
        "lit/directives/repeat.js": "https://cdn.jsdelivr.net/npm/lit@3.3.3/directives/repeat.js/+esm",
        "marked": "https://cdn.jsdelivr.net/npm/marked@11.2.0/+esm",
        "@awesome.me/webawesome/dist/": "https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/"
      }
    }
  </script>

  <!-- The two loaders: the elements of the page and of the examples are defined when they appear -->
  <script type="module" data-webawesome="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn" src="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/webawesome.loader.js"></script>
  <script type="module" data-webawesome-extras="../src" src="../src/webawesome-extras.loader.js"></script>
  <script type="module" src="site/site.js"></script>
</head>
<body>
  <header class="site-header">
    <button id="menu-button" class="site-menu" aria-label="Menu" aria-expanded="false" aria-controls="site-nav">&#9776;</button>
    <a class="site-title" href="#/index.md">webawesome-extras</a>
    <button id="theme-button" class="site-theme" aria-label="Switch between the light and the dark theme">&#9681;</button>
  </header>
  <div class="site-layout">
    <nav id="site-nav" class="site-nav" aria-label="Documentation"></nav>
    <main id="site-content" class="site-content" tabindex="-1">Loading...</main>
  </div>
</body>
</html>
